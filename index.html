<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コンパニオン試作｜ケアマネ手帳</title>
<style>
  :root{ --teal:#0B7A68; --teal-dark:#075C4E; --cream:#F7F5EF; --card:#FFFFFF; --ink:#2B2B28; --muted:#8A8578; --line:#E3DED0; --red:#C0392B; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ margin:0; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; background:var(--cream); color:var(--ink); display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }

  /* ---------- キャラ常駐ステージ（固定表示・影なし） ---------- */
  .stagewrap{ flex:none; background:var(--cream); }
  #stage{ max-width:520px; margin:0 auto; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--line); padding:10px 16px; }
  /* ステージ帯の高さは120pxで固定：タイピング表示（横長）⇔通常ポーズ（正方形）を
     切り替えても帯の高さが変わらず、会話エリアが上下にガタつかない */
  .stage-char{ position:relative; flex:1; min-width:0; height:120px; }
  /* キャラは原則として完全静止。動かす場合はポーズ絵の差し替えでのみ行う */
  .stage-char img,.stage-char svg,.stage-char video{ width:88px; height:88px; aspect-ratio:1/1; object-fit:cover; object-position:top; border-radius:12px; border:1px solid var(--line); background:#F3EDDD; display:block; }
  /* タイピング表示は横向き構図（3:2）を帯状に全体表示する（切り取らず contain で見せる） */
  .stage-char video.ly-anim,.stage-char img.ly-typing{ width:180px; height:120px; aspect-ratio:3/2; object-fit:contain; object-position:center; border:none; border-radius:0; background:transparent; }
  /* ステージ内のレイヤー（通常ポーズ／タイピングアニメ／タイピング静止画）を重ねて切り替える */
  #stage-face{ position:relative; display:block; width:100%; height:120px; }
  #stage-face .ly{ position:absolute; left:0; top:50%; transform:translateY(-50%); }
  @keyframes blink{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }

  /* ---------- 会話エリアだけがスクロールする ---------- */
  main{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; width:100%; }
  .wrap{ max-width:520px; margin:0 auto; padding:14px 12px 40px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .panel h2{ font-size:14px; margin:0 0 10px; color:var(--teal-dark); }
  .chars{ display:flex; gap:10px; }
  .char{ flex:1; border:1.5px solid var(--line); border-radius:10px; padding:10px 6px; text-align:center; cursor:pointer; background:#fff; }
  .char.sel{ border-color:var(--teal); background:#F0F6F3; }
  .char img,.char svg{ width:72px; height:72px; aspect-ratio:1/1; object-fit:cover; object-position:top; border-radius:50%; background:#F3EDDD; }
  .char .n{ font-size:14px; font-weight:700; margin-top:6px; }
  .char .d{ font-size:11px; color:var(--muted); }
  .flows{ display:flex; gap:10px; }
  .flowbtn{ flex:1; border:none; border-radius:10px; padding:14px 8px; font-size:16px; font-weight:700; color:#fff; background:var(--teal); cursor:pointer; }
  .flowbtn.sub{ background:#fff; color:var(--teal); border:1.5px solid var(--teal); }
  .flowbtn:active{ opacity:.8; }
  .progress{ display:none; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:12px; }
  .progress .row{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .progress .row b{ color:var(--teal-dark); }
  .bar{ height:6px; background:#ECE8DB; border-radius:99px; overflow:hidden; }
  .bar i{ display:block; height:100%; width:0%; background:var(--teal); border-radius:99px; transition:width .4s; }

  /* ---------- チャット（吹き出しの丸みで親しみやすさを残す） ---------- */
  #chat{ display:flex; flex-direction:column; gap:10px; }
  .msg{ display:flex; align-items:flex-start; animation:fadein .2s ease; }
  @keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }
  .bubble{ background:var(--card); border:1px solid var(--line); border-radius:4px 16px 16px 16px; padding:10px 12px; font-size:15px; line-height:1.55; max-width:88%; white-space:pre-wrap; cursor:pointer; }
  .bubble .red{ color:var(--red); font-weight:700; }
  .bubble.draft{ background:#FFFDF4; border-style:dashed; font-size:14px; }
  .bubble.typing{ display:flex; gap:4px; align-items:center; padding:14px 12px; cursor:default; }
  .bubble.typing span{ width:7px; height:7px; border-radius:50%; background:#B9B2A0; animation:blink 1s infinite; }
  .bubble.typing span:nth-child(2){ animation-delay:.2s; } .bubble.typing span:nth-child(3){ animation-delay:.4s; }
  .bubble.card{ background:#fff; border:1px solid var(--line); border-radius:12px; cursor:default; min-width:230px; }
  .bubble.card .ct{ font-size:12px; font-weight:700; color:var(--teal-dark); letter-spacing:.06em; margin-bottom:6px; }
  .bubble.card table{ border-collapse:collapse; font-size:14.5px; width:100%; }
  .bubble.card tr{ border-bottom:1px solid #EFECE2; }
  .bubble.card tr:last-child{ border-bottom:none; }
  .bubble.card th{ text-align:left; color:var(--muted); font-weight:700; padding:5px 10px 5px 0; white-space:nowrap; vertical-align:top; }
  .bubble.card td{ padding:5px 0; font-weight:700; }
  .me{ display:flex; justify-content:flex-end; animation:fadein .2s ease; }
  .me .b{ background:var(--teal); color:#fff; border-radius:16px 4px 16px 16px; padding:9px 12px; font-size:15px; max-width:82%; white-space:pre-wrap; }
  .done-item{ display:flex; align-items:center; gap:8px; background:#F0F6F3; border:1px solid #D9E7E0; color:var(--teal-dark); border-radius:8px; padding:7px 10px; font-size:13px; animation:fadein .2s ease; }
  .done-item .ck{ font-weight:700; }
  .choices{ display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 4px 0; animation:fadein .2s ease; }
  .choices button{ border:1.5px solid var(--teal); background:#fff; color:var(--teal-dark); font-size:15px; font-weight:700; border-radius:99px; padding:9px 16px; cursor:pointer; }
  .choices button.primary{ background:var(--teal); color:#fff; }
  .choices button:active{ opacity:.75; }
  .todo-form{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; animation:fadein .2s ease; }
  .todo-form input{ width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; }
  .todo-form .add{ width:100%; border:none; background:var(--teal); color:#fff; font-size:15px; font-weight:700; border-radius:10px; padding:11px; cursor:pointer; }
  .todo-form .none{ width:100%; background:#fff; color:var(--teal-dark); border:1.5px solid var(--line); font-size:15px; font-weight:700; border-radius:10px; padding:11px; cursor:pointer; margin-top:8px; }
  .speak{ margin-left:0; }
  .restart{ display:none; width:100%; margin-top:18px; border:1.5px solid var(--teal); background:#fff; color:var(--teal-dark); font-size:15px; font-weight:700; border-radius:10px; padding:12px; cursor:pointer; }
  .note{ font-size:12px; color:var(--muted); text-align:center; margin-top:16px; line-height:1.6; }

  /* ---------- 設定（歯車ボタン＋シート） ---------- */
  #gear{ margin-left:auto; flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--teal-dark); font-size:19px; line-height:1; cursor:pointer; }
  #gear:active{ opacity:.7; }
  #sheet-overlay{ display:none; position:fixed; inset:0; background:rgba(43,43,40,.45); z-index:50; align-items:flex-end; justify-content:center; }
  #sheet-overlay.open{ display:flex; }
  #sheet{ background:var(--cream); width:100%; max-width:520px; max-height:86vh; max-height:86dvh; overflow-y:auto; border-radius:16px 16px 0 0; padding:16px 16px 26px; animation:fadein .18s ease; }
  #sheet h2{ font-size:16px; margin:0; color:var(--teal-dark); }
  #sheet h3{ font-size:13px; margin:18px 0 8px; color:var(--muted); }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; }
  #sheet-close{ width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--ink); font-size:15px; cursor:pointer; }
  .ovbtns{ display:flex; gap:10px; }
  .ovbtn{ flex:1; border:1.5px solid var(--line); border-radius:10px; padding:11px 4px; text-align:center; cursor:pointer; background:#fff; font-size:14px; font-weight:700; color:var(--ink); }
  .ovbtn.sel{ border-color:var(--teal); background:#F0F6F3; color:var(--teal-dark); }
  .ovbtn .d{ display:block; font-size:11px; font-weight:400; color:var(--muted); margin-top:2px; }
  #sheet-apply{ width:100%; margin-top:20px; border:none; background:var(--teal); color:#fff; font-size:15px; font-weight:700; border-radius:10px; padding:12px; cursor:pointer; }
  #sheet-done{ width:100%; margin-top:8px; background:#fff; color:var(--teal-dark); border:1.5px solid var(--line); font-size:15px; font-weight:700; border-radius:10px; padding:12px; cursor:pointer; }
</style>
</head>
<body>
<div class="stagewrap">
  <div id="stage">
    <div class="stage-char">
      <span id="stage-face"></span>
    </div>
    <button id="gear" onclick="openSheet()" aria-label="設定">⚙</button>
  </div>
</div>

<main id="scroller">
 <div class="wrap">
  <div class="progress" id="progress">
    <div class="row"><span id="prog-text">全4件</span><b id="prog-rest">あと4件</b></div>
    <div class="bar"><i id="prog-bar"></i></div>
  </div>

  <div id="chat"></div>
  <button class="restart" id="restart" onclick="location.reload()">↺ 最初から試す</button>
  <p class="note">これは様子見のための試作です。本番アプリには入っていません。<br>例に出てくる名前はすべて架空のものです。</p>
 </div>
</main>

<div id="sheet-overlay">
  <div id="sheet">
    <div class="sheet-head"><h2>設定</h2><button id="sheet-close" onclick="closeSheet()" aria-label="閉じる">✕</button></div>
    <h3>相手</h3>
    <div class="chars">
      <div class="char sel" id="char-male" onclick="selectChar('male')">
        <img src="male.png" alt="男性キャラ" width="72" height="72">
        <div class="n">男性キャラ</div><div class="d">同僚みたいな存在</div>
      </div>
      <div class="char" id="char-hiro" onclick="selectChar('hiro')">
        <span id="hiro-thumb"></span>
        <div class="n">ヒロ</div><div class="d">丁寧な案内役</div>
      </div>
    </div>
    <h3>流れ（試作用の上書き）</h3>
    <div class="ovbtns">
      <button class="ovbtn sel" id="ov-auto" onclick="setFlowOverride('auto')">自動<span class="d">時刻で判定</span></button>
      <button class="ovbtn" id="ov-morning" onclick="setFlowOverride('morning')">朝<span class="d">朝の流れ</span></button>
      <button class="ovbtn" id="ov-evening" onclick="setFlowOverride('evening')">夕<span class="d">夕の流れ</span></button>
    </div>
    <button id="sheet-apply" onclick="applyAndRestart()">この設定で最初から</button>
    <button id="sheet-done" onclick="closeSheet()">閉じる</button>
  </div>
</div>

<script>
const HIRO_SVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#F3EDDD"/>
  <path d="M50 96 L50 78 C38 74 30 82 28 96 Z" fill="#0B7A68"/>
  <path d="M50 96 L50 78 C62 74 70 82 72 96 Z" fill="#0B7A68"/>
  <rect x="44" y="66" width="12" height="12" fill="#F6CFAF"/>
  <path d="M50 70 L44 78 L50 88 L56 78 Z" fill="#FFFFFF"/>
  <circle cx="50" cy="46" r="21" fill="#FBD9B8"/>
  <path d="M27 50 C25 22 38 12 50 12 C62 12 75 22 73 50 C73 56 71 60 69 62 C68 46 64 34 58 30 C64 40 63 30 50 28 C38 30 33 38 31 62 C29 60 27 56 27 50 Z" fill="#4A3226"/>
  <circle cx="42" cy="47" r="2.4" fill="#2B2B28"/><circle cx="58" cy="47" r="2.4" fill="#2B2B28"/>
  <path d="M45 58 Q50 61 55 58" stroke="#B4654A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <circle cx="35" cy="54" r="3" fill="#F5A58E" opacity=".55"/><circle cx="65" cy="54" r="3" fill="#F5A58E" opacity=".55"/>
</svg>`;

const CHAR_NAMES = { male:'男性キャラ', hiro:'ヒロ' };

/* ---------- 設定（キャラ＋流れ上書き）。メイン画面には出さず、歯車からのシート内だけで変える ---------- */
let settings = { char:'male', flow:'auto' };
try{
  const s = JSON.parse(localStorage.getItem('companion-settings') || 'null');
  if(s){ if(s.char) settings.char = s.char; if(s.flow) settings.flow = s.flow; }
}catch(e){}
function saveSettings(){
  try{ localStorage.setItem('companion-settings', JSON.stringify(settings)); }catch(e){}
}
let charType = settings.char === 'hiro' ? 'hiro' : 'male';
document.getElementById('hiro-thumb').innerHTML = HIRO_SVG;

function avatarHTML(){
  if(charType === 'male') return '<img src="male.png" alt="" width="88" height="88">';
  return HIRO_SVG;
}
/* ステージは3レイヤー重ね：通常ポーズ（ly-idle）／タイピングアニメ動画（ly-anim）／
   動画が使えない環境向けのタイピング静止画（ly-typing）。表示切替は stageTyping() が行う */
function refreshStage(){
  const face = document.getElementById('stage-face');
  if(charType === 'male'){
    face.innerHTML =
      '<span class="ly ly-idle"><img src="male.png" alt="" width="88" height="88"></span>' +
      '<video class="ly ly-anim" src="male-typing-anim.webm" muted loop playsinline preload="auto" width="180" height="120" style="display:none"></video>' +
      '<img class="ly ly-typing" src="male-typing.png" alt="" width="180" height="120" style="display:none">';
    probeAnimVideo(face.querySelector('video.ly-anim'));
  } else {
    face.innerHTML = '<span class="ly ly-idle">' + HIRO_SVG + '</span>';
  }
}
function selectChar(t){
  charType = t;
  settings.char = t; saveSettings();
  document.getElementById('char-male').classList.toggle('sel', t==='male');
  document.getElementById('char-hiro').classList.toggle('sel', t==='hiro');
  refreshStage();
}
function setFlowOverride(v){
  settings.flow = v; saveSettings();
  ['auto','morning','evening'].forEach(k => {
    document.getElementById('ov-' + k).classList.toggle('sel', settings.flow === k);
  });
}
function openSheet(){ document.getElementById('sheet-overlay').classList.add('open'); }
function closeSheet(){ document.getElementById('sheet-overlay').classList.remove('open'); }
function applyAndRestart(){ saveSettings(); location.reload(); }
document.getElementById('sheet-overlay').addEventListener('click', e => {
  if(e.target.id === 'sheet-overlay') closeSheet();
});
/* 保存済み設定をUIに反映 */
document.getElementById('char-male').classList.toggle('sel', charType==='male');
document.getElementById('char-hiro').classList.toggle('sel', charType==='hiro');
setFlowOverride(settings.flow);
refreshStage();

/* 朝／夕は時刻で自動判定（4:00〜11:59は朝、12:00〜翌3:59は夕）。設定で上書き可能 */
function decideFlow(){
  if(settings.flow === 'morning' || settings.flow === 'evening') return settings.flow;
  const h = new Date().getHours();
  return (h >= 4 && h < 12) ? 'morning' : 'evening';
}

const chat = document.getElementById('chat');
const stage = document.getElementById('stage');
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- スクロール追随（最下部付近にいる時だけ追随し、読んでいる間は引っ張らない） ---------- */
const scroller = document.getElementById('scroller');
let follow = true;
function nearBottom(){
  return (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight) <= 140;
}
scroller.addEventListener('scroll', () => { follow = nearBottom(); }, { passive:true });
function scrollDown(){
  if(!follow) return;
  scroller.scrollTop = scroller.scrollHeight;
}
function resetScroll(){ follow = true; scroller.scrollTop = 0; }
/* 状態テキスト表示は撤去済み（上部はキャラ絵のみ）。呼び出し側の互換のため空関数として残す */
function setStatus(t){ /* no-op */ }
function setStatusTyping(){ /* no-op */ }

/* ---------- タイプライター（ドラクエ式） ---------- */
function collectTextNodes(node, arr){
  node.childNodes.forEach(n => {
    if(n.nodeType === 3) arr.push(n);
    else collectTextNodes(n, arr);
  });
}
function typeInto(bubble, speed){
  return new Promise(resolve => {
    const nodes = []; collectTextNodes(bubble, nodes);
    const texts = nodes.map(n => n.textContent);
    const total = texts.reduce((a, t) => a + t.length, 0);
    if(total === 0){ resolve(); return; }
    nodes.forEach(n => n.textContent = '');
    let shown = 0, finished = false, iv = null;
    const finish = () => {
      if(finished) return; finished = true;
      if(iv) clearInterval(iv);
      nodes.forEach((n, j) => n.textContent = texts[j]);
      bubble.removeEventListener('click', finish);
      resolve();
    };
    bubble.addEventListener('click', finish);
    iv = setInterval(() => {
      shown++;
      let rest = shown;
      nodes.forEach((n, j) => {
        const t = texts[j];
        const take = Math.max(0, Math.min(t.length, rest));
        n.textContent = t.slice(0, take);
        rest -= t.length;
      });
      if(shown % 4 === 0) scrollDown();
      if(shown >= total){ finish(); }
    }, speed || 30);
  });
}

/* ---------- 会話部品 ---------- */
async function say(html, cls){
  /* キャラが文章を出している間はタイピングアニメーション、出し終わったら通常ポーズに戻る */
  stageTyping(true);
  const ind = document.createElement('div'); ind.className = 'msg';
  ind.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(ind); scrollDown();
  await wait(480);
  ind.remove();
  const d = document.createElement('div'); d.className = 'msg';
  const bub = document.createElement('div'); bub.className = 'bubble' + (cls ? ' ' + cls : '');
  bub.innerHTML = html;
  d.appendChild(bub);
  chat.appendChild(d); scrollDown();
  await typeInto(bub, 30);
  await wait(200);
  stageTyping(false);
}
function sayCard(html){
  const d = document.createElement('div'); d.className = 'msg';
  d.innerHTML = `<div class="bubble card">${html}</div>`;
  chat.appendChild(d); scrollDown();
}
function me(text){
  const d = document.createElement('div'); d.className = 'me';
  const b = document.createElement('div'); b.className = 'b'; b.textContent = text;
  d.appendChild(b); chat.appendChild(d); scrollDown();
}
function doneItem(text){
  const d = document.createElement('div'); d.className = 'done-item';
  d.innerHTML = `<span class="ck">✓</span><span></span>`;
  d.querySelector('span:last-child').textContent = text;
  chat.appendChild(d); scrollDown();
}
function choices(list){
  return new Promise(resolve => {
    const wrap = document.createElement('div'); wrap.className = 'choices';
    list.forEach((c, i) => {
      const b = document.createElement('button');
      b.textContent = c.label; if(i===0) b.className = 'primary';
      b.onclick = () => { me(c.label); wrap.remove(); resolve(c.value); };
      wrap.appendChild(b);
    });
    chat.appendChild(wrap); scrollDown();
  });
}
function textForm(placeholder, submitLabel, noneLabel){
  return new Promise(resolve => {
    const wrap = document.createElement('div'); wrap.className = 'todo-form';
    const input = document.createElement('input');
    input.type = 'text'; input.placeholder = placeholder;
    const add = document.createElement('button'); add.className = 'add'; add.textContent = submitLabel;
    wrap.appendChild(input); wrap.appendChild(add);
    if(noneLabel){
      const none = document.createElement('button'); none.className = 'none'; none.textContent = noneLabel;
      none.onclick = () => { me(noneLabel); wrap.remove(); resolve(null); };
      wrap.appendChild(none);
    }
    chat.appendChild(wrap); scrollDown();
    input.focus();
    add.onclick = () => {
      const v = input.value.trim();
      if(!v){ input.focus(); return; }
      me(v); wrap.remove(); resolve(v);
    };
    input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); add.click(); } });
  });
}
function speakBtn(textToRead){
  return new Promise(resolve => {
    const wrap = document.createElement('div'); wrap.className = 'choices speak';
    const b = document.createElement('button'); b.textContent = '🔊 読み上げ';
    const next = document.createElement('button'); next.textContent = '次へ'; next.className = 'primary';
    b.onclick = () => {
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(textToRead);
        u.lang = 'ja-JP'; u.rate = 1.0;
        speechSynthesis.speak(u);
      }catch(e){}
    };
    next.onclick = () => { try{ speechSynthesis.cancel(); }catch(e){} wrap.remove(); resolve(); };
    wrap.appendChild(b); wrap.appendChild(next);
    chat.appendChild(wrap); scrollDown();
  });
}
/* タイピングアニメーション（male-typing-anim.webm：横向き構図で横顔のまま
   両手がキーボードを打つ透過WebM）と、フォールバック用の静止画（male-typing.png・同じ横向き構図）を用意する。
   動画が使える環境では動画、使えない場合は静止画、どちらも無い場合は通常ポーズのまま（エラーにしない） */
let typingImgOK = false;
(function(){
  const im = new Image();
  im.onload = () => { typingImgOK = true; };
  im.onerror = () => { typingImgOK = false; };
  im.src = 'male-typing.png';
})();
/* 動画のアルファ（透過）が実際に効く環境かどうかを、隅のピクセルの透明度で判定する。
   一部のブラウザはWebMの透過を無視して黒背景で描くため、その場合は動画を使わない */
let typingAnimOK = false;
function probeAnimVideo(vid){
  if(!vid) return;
  if(!vid.canPlayType || !vid.canPlayType('video/webm; codecs="vp9"')){ typingAnimOK = false; return; }
  const mark = () => {
    try{
      const c = document.createElement('canvas');
      c.width = 48; c.height = 48;
      const ctx = c.getContext('2d');
      if(!ctx){ typingAnimOK = true; return; }
      ctx.drawImage(vid, 0, 0, 48, 48);
      typingAnimOK = ctx.getImageData(1, 1, 1, 1).data[3] < 16;
    }catch(e){ typingAnimOK = true; }
  };
  if(vid.readyState >= 3) mark();
  else vid.addEventListener('canplay', mark, { once:true });
  vid.addEventListener('error', () => { typingAnimOK = false; }, { once:true });
}

/* ステージの表示切替：
   on=true  … キャラが文章を出している間・まとめ作業中 → タイピングアニメーション（無理なら静止画）
   on=false … 利用者の入力・タップを待っている間 → 通常ポーズ */
function stageTyping(on){
  if(charType !== 'male') return;
  const face = document.getElementById('stage-face');
  const idle = face.querySelector('.ly-idle');
  const anim = face.querySelector('video.ly-anim');
  const still = face.querySelector('img.ly-typing');
  if(!idle) return;
  if(on){
    if(anim && typingAnimOK){
      idle.style.display = 'none';
      if(still) still.style.display = 'none';
      anim.style.display = 'block';
      try{
        const p = anim.play();
        if(p && p.catch) p.catch(() => {
          anim.style.display = 'none';
          if(still && typingImgOK) still.style.display = 'block';
          else idle.style.display = 'block';
        });
      }catch(e){
        anim.style.display = 'none';
        if(still && typingImgOK) still.style.display = 'block';
        else idle.style.display = 'block';
      }
    } else if(still && typingImgOK){
      idle.style.display = 'none';
      if(anim) anim.style.display = 'none';
      still.style.display = 'block';
    }
  } else {
    if(anim){ try{ anim.pause(); }catch(e){} anim.style.display = 'none'; }
    if(still) still.style.display = 'none';
    idle.style.display = 'block';
  }
}

async function workPose(ms){
  setStatusTyping();
  stageTyping(true);
  await wait(ms);
  stageTyping(false);
}
function showRestart(){ document.getElementById('restart').style.display = 'block'; scrollDown(); }

/* ---------- 朝の流れ ---------- */

  await speakBtn('今日の予定は、訪問が2件、電話が1件です。10時から山田さんのお宅へ訪問、13時に高橋さんへ電話、15時から佐藤さんのお宅へ訪問です。');
  await say('あと、<span class="red">期限切れが2件</span>あります。このまま放っておくと申請が遅れてしまいます。');

  if(v === 'later') await say('分かりました。あとでまた声をかけますね。');
  await say('朝の確認は以上です。いってらっしゃい。');

/* ---------- 夕の流れ ---------- */
let totalItems = 4, doneCount = 0;
function updateProgress(){
  document.getElementById('prog-text').textContent = `全${totalItems}件`;
  document.getElementById('prog-rest').textContent = `あと${totalItems - doneCount}件`;
  document.getElementById('prog-bar').style.width = (doneCount/totalItems*100) + '%';
}
async function finishItem(label){
  doneCount++; updateProgress();
  await wait(250); doneItem(label);
}

async function startEvening(){
  resetScroll(); setStatus('夕の入力を手伝っています');
  const p = document.getElementById('progress'); p.style.display = 'block'; updateProgress();
  await say('お疲れさまでした。今日の入力を一緒に片付けましょう。全部で4件あります。1件ずつ聞いていきますね。');

  /* 件1：山田さん モニタリング */
  await say('山田さんのモニタリング、今日は完了にしますか？');
  let v = await choices([{label:'完了にする', value:'done'}, {label:'してない', value:'no'}]);
  await finishItem(v === 'done' ? '山田さん モニタリング完了' : '山田さん モニタリングは未完了のまま');
  await say(v === 'done' ? '記録しました。' : '分かりました。そのまま残しておきます。');

  /* 件2：高橋さん 支援経過の下書き */
  await say('高橋さんの支援経過の下書きができています。内容を確認しますか？');
  v = await choices([{label:'確認する', value:'see'}, {label:'あとで', value:'later'}]);
  if(v === 'see'){
    await say('自宅訪問しモニタリング実施。本人より「調子は安定している」との話あり。次月利用表を本人に確認後、署名いただく。', 'draft');
    v = await choices([{label:'記録する', value:'rec'}, {label:'直したい', value:'edit'}]);
    await finishItem(v === 'rec' ? '高橋さん 支援経過を記録' : '高橋さん 支援経過は下書きのまま');
    await say(v === 'rec' ? '記録しました。' : '下書きのまま残しておきます。あとで直せます。');
  } else {
    await finishItem('高橋さん 支援経過は下書きのまま');
    await say('分かりました。下書きのまま残しておきます。');
  }

  /* 件3：佐藤さん モニタリング */
  await say('佐藤さんのモニタリング、今日は完了にしますか？');
  v = await choices([{label:'完了にする', value:'done'}, {label:'してない', value:'no'}]);
  await finishItem(v === 'done' ? '佐藤さん モニタリング完了' : '佐藤さん モニタリングは未完了のまま');
  await say(v === 'done' ? '記録しました。' : '分かりました。そのまま残しておきます。');

  /* 件4：今日発生したtodo（1行放り込み→自動まとめ） */
  await say('最後です。今日、電話や訪問で発生したtodoはありますか？\n1行で放り込んでくれれば、私がまとめます。');
  const todo = await todoCapture();
  if(todo){
    await finishItem(`todo追加：${todo.person}さん・${todo.due || '期限なし'}・${todo.content}`);
    await say('追加しました。');
  } else {
    await finishItem('今日発生したtodoはなし');
    await say('分かりました。');
  }

  await say('全部終わりました。お疲れさまでした。ゆっくり休んでくださいね。');
  setStatus('夕の入力が終わりました');
  showRestart();
}

/* ---------- todoの自動まとめ ---------- */
const ROSTER = ['山田', '高橋', '佐藤', '田中', '鈴木'];
const DUE_WORDS = [
  { re:/あさって|明後日/, label:'あさって' },
  { re:/明日|あした/, label:'明日' },
  { re:/今日中|今日|きょう/, label:'今日' },
  { re:/来週/, label:'来週' },
  { re:/今週/, label:'今週' },
  { re:/月末/, label:'月末' },
  { re:/来月/, label:'来月' }
];
function parseTodo(text){
  let rest = text.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
  let person = null, due = null, pastDate = false;
  for(const name of ROSTER){
    if(rest.includes(name)){ person = name; break; }
  }
  if(person) rest = rest.replace(new RegExp(person + '(さん|様)?', 'g'), ' ');
  /* 月日表記（11/12、11月12日）は期限候補として拾い、内容からは必ず除く */
  let dateLabel = null;
  const dm = rest.match(/(\d{1,2})[/／](\d{1,2})/) || rest.match(/(\d{1,2})月(\d{1,2})日/);
  if(dm){
    const mo = parseInt(dm[1], 10), dy = parseInt(dm[2], 10);
    dateLabel = mo + '/' + dy;
    rest = rest.replace(dm[0], ' ');
    const now = new Date();
    const cand = new Date(now.getFullYear(), mo - 1, dy);
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    pastDate = cand < today;
  }
  for(const d of DUE_WORDS){
    if(d.re.test(rest)){ due = d.label; rest = rest.replace(d.re, ' '); break; }
  }
  if(!due && dateLabel){ due = dateLabel; }
  else { pastDate = false; } /* 期限が言葉で決まった場合、日付は除去のみで過去確認はしない */
  let content = rest.replace(/[\s　]+/g, ' ').trim();
  content = content.split(' ').filter(tok => !/^(さん|様|に|へ|を|の|と|まで)$/.test(tok)).join(' ');
  content = content.replace(/^(までに|まで|に|へ)(?=\S)/, '').replace(/(、|。)+$/, '').trim();
  return { person, due, content, pastDate };
}
function todoCardHTML(t){
  return `<div class="ct">TODO（まとめました）</div>
  <table>
    <tr><th>利用者</th><td>${t.person}さん</td></tr>
    <tr><th>期限</th><td>${t.due || 'なし'}</td></tr>
    <tr><th>内容</th><td>${t.content}</td></tr>
  </table>`;
}
async function askDue(){
  await say('期限はいつにしますか？');
  const dv = await choices([
    {label:'明日', value:'明日'},
    {label:'来週', value:'来週'},
    {label:'なし', value:''}
  ]);
  return dv || null;
}
async function todoCapture(){
  const raw = await textForm('例：山田さんに明日電話', '放り込む', '今日はなし');
  if(raw === null) return null;
  const t = parseTodo(raw);
  let dueDecided = !!t.due; /* 「なし」を選んだ場合も含め、決まったかどうかを管理 */

  const picked = [];
  if(t.person) picked.push(`利用者は${t.person}さん`);
  if(t.due) picked.push(`期限は${t.due}`);
  if(t.content) picked.push(`内容は「${t.content}」`);
  if(picked.length) await say('受け取りました。' + picked.join('、') + 'ですね。');

  /* 月日表記が過去だったら、勝手に確定せず確認する */
  if(t.pastDate){
    await say(`期限の${t.due}は、今日より前の日付です。過ぎていますが、この日付でいいですか？`);
    const ok = await choices([
      {label:'この日付でいい', value:'keep'},
      {label:'選び直す', value:'re'}
    ]);
    if(ok === 're'){ t.due = await askDue(); }
    t.pastDate = false;
  }

  while(true){
    if(!t.person){
      await say('誰のことですか？');
      t.person = await choices(ROSTER.map(n => ({ label:n + 'さん', value:n })));
    }
    if(!dueDecided){
      t.due = await askDue();
      dueDecided = true;
    }
    if(!t.content){
      await say('内容を教えてください。');
      t.content = await textForm('例：電話する、訪問する', '入れる', null);
    }
    await say('揃いました。まとめますね。');
    await workPose(2800);
    setStatus('夕の入力を手伝っています');
    sayCard(todoCardHTML(t));
    const act = await choices([
      {label:'登録する', value:'ok'},
      {label:'直す', value:'fix'}
    ]);
    if(act === 'ok') return t;
    await say('どこを直しますか？');
    const f = await choices([
      {label:'利用者', value:'person'},
      {label:'期限', value:'due'},
      {label:'内容', value:'content'}
    ]);
    if(f === 'person') t.person = null;
    if(f === 'due') dueDecided = false;
    if(f === 'content') t.content = '';
  }
}

/* ---------- 起動：開いたら選択UIなしで、そのまま会話を始める ---------- */
if(decideFlow() === 'morning'){ startMorning(); } else { startEvening(); }
